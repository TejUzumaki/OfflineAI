<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Offline AI Chat</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #e0e0e0; margin: 0; padding: 15px; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; }
        h1 { color: #4caf50; text-align: center; font-size: 1.5rem; margin: 10px 0; }
        #status { text-align: center; color: #ff9800; font-size: 0.9rem; margin-bottom: 10px; }
        #chat-box { flex: 1; overflow-y: auto; border: 1px solid #333; padding: 15px; background: #1e1e1e; border-radius: 8px; margin-bottom: 15px; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 10px 15px; border-radius: 15px; max-width: 85%; word-wrap: break-word; line-height: 1.4; }
        .user { background: #005c4b; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .ai { background: #2a2a2a; color: #e0e0e0; align-self: flex-start; border-bottom-left-radius: 2px; }
        #input-area { display: flex; gap: 10px; }
        #user-input { flex: 1; padding: 15px; border: 1px solid #444; background: #333; color: white; border-radius: 25px; outline: none; font-size: 16px; }
        #send-btn { padding: 15px 20px; background: #4caf50; color: white; border: none; cursor: pointer; border-radius: 25px; font-size: 16px; font-weight: bold; }
        #send-btn:disabled { background: #555; cursor: not-allowed; }
    </style>
</head>
<body>
    <h1>Offline SLM Chat 🤖</h1>
    <div id="status">Initializing AI Model... Please wait.</div>
    <div id="chat-box"></div>
    <div id="input-area">
        <input type="text" id="user-input" placeholder="Say something..." disabled autocomplete="off">
        <button id="send-btn" disabled>Send</button>
    </div>
    <script type="module" src="app.js"></script>
</body>
</html>
